apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhythm-api
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: rhythm-api } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rhythm-api, app.kubernetes.io/component: api }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: "/metrics" }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: rhythm-api:production
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: rhythm-runtime }
            - secretRef: { name: rhythm-runtime-secrets }
          env:
            - { name: RHYTHM_ROLE, value: api }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /livez, port: http }, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3 }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhythm-scheduler
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: rhythm-scheduler } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rhythm-scheduler, app.kubernetes.io/component: scheduler }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: "/metrics" }
    spec:
      containers:
        - name: scheduler
          image: rhythm-api:production
          envFrom:
            - configMapRef: { name: rhythm-runtime }
            - secretRef: { name: rhythm-runtime-secrets }
          env:
            - { name: RHYTHM_ROLE, value: scheduler }
            - { name: RHYTHM_DATABASE_MAX_CONNS, value: "8" }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /livez, port: http }, periodSeconds: 10 }
          resources:
            requests: { cpu: 150m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhythm-api-worker
spec:
  replicas: 4
  selector: { matchLabels: { app.kubernetes.io/name: rhythm-api-worker } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rhythm-api-worker, app.kubernetes.io/component: worker }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: "/metrics" }
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: rhythm-api:production
          envFrom:
            - configMapRef: { name: rhythm-runtime }
            - secretRef: { name: rhythm-runtime-secrets }
          env:
            - { name: RHYTHM_ROLE, value: worker }
            - { name: RHYTHM_WORKER_CONCURRENCY, value: "32" }
            - { name: RHYTHM_DATABASE_MAX_CONNS, value: "12" }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /livez, port: http }, periodSeconds: 10 }
          resources:
            requests: { cpu: "1", memory: 768Mi }
            limits: { cpu: "2", memory: 1536Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhythm-background
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: rhythm-background } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rhythm-background, app.kubernetes.io/component: background }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: "/metrics" }
    spec:
      containers:
        - name: background
          image: rhythm-api:production
          envFrom:
            - configMapRef: { name: rhythm-runtime }
            - secretRef: { name: rhythm-runtime-secrets }
          env:
            - { name: RHYTHM_ROLE, value: background }
            - { name: RHYTHM_DATABASE_MAX_CONNS, value: "8" }
            - { name: RHYTHM_BROWSER_JOB_CONCURRENCY, value: "8" }
            - { name: RHYTHM_DEPLOYMENT_JOB_CONCURRENCY, value: "4" }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /livez, port: http }, periodSeconds: 10 }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhythm-script-runner
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: rhythm-script-runner } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rhythm-script-runner, app.kubernetes.io/component: script-runner }
    spec:
      containers:
        - name: script-runner
          image: rhythm-api:production
          command: [/usr/local/bin/rhythm-script-runner]
          envFrom:
            - configMapRef: { name: rhythm-runtime }
            - secretRef: { name: rhythm-runtime-secrets }
          env:
            - { name: RHYTHM_SCRIPT_RUNNER_ADDR, value: ":8090" }
          ports: [{ name: http, containerPort: 8090 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          resources:
            requests: { cpu: 500m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhythm-browser-agent
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: rhythm-browser-agent } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rhythm-browser-agent, app.kubernetes.io/component: browser-agent }
    spec:
      containers:
        - name: browser-agent
          image: rhythm-browser-agent:production
          envFrom:
            - secretRef: { name: rhythm-runtime-secrets }
          env:
            - { name: RHYTHM_BROWSER_AGENT_ADDR, value: 0.0.0.0 }
            - { name: RHYTHM_BROWSER_AGENT_PORT, value: "8091" }
            - { name: RHYTHM_BROWSER_MAX_CONCURRENCY, value: "2" }
            # The container itself remains restricted; Chromium's setuid
            # sandbox is unavailable under the default OpenShift restricted SCC.
            - { name: RHYTHM_CHROMIUM_SANDBOX, value: "false" }
          ports: [{ name: http, containerPort: 8091 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5, failureThreshold: 6 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          resources:
            requests: { cpu: "1", memory: 1500Mi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 512Mi }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhythm-web
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: rhythm-web } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rhythm-web, app.kubernetes.io/component: web }
    spec:
      containers:
        - name: web
          image: rhythm-web:production
          env:
            - { name: RHYTHM_API_URL, value: http://rhythm-api:8080 }
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          resources:
            requests: { cpu: 150m, memory: 192Mi }
            limits: { cpu: 750m, memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true }
