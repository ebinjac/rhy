apiVersion: batch/v1
kind: Job
metadata:
  name: rhythm-migrate
  labels:
    app.kubernetes.io/name: rhythm-migrate
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rhythm-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: rhythm-api:production
          command: [/usr/local/bin/rhythm-migrate]
          envFrom:
            - configMapRef: { name: rhythm-runtime }
            - secretRef: { name: rhythm-runtime-secrets }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
