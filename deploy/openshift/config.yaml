apiVersion: v1
kind: ConfigMap
metadata:
  name: rhythm-runtime
data:
  RHYTHM_STORAGE_MODE: postgres
  RHYTHM_HTTP_ADDR: ":8080"
  RHYTHM_WORKER_CONCURRENCY: "32"
  RHYTHM_BROWSER_JOB_CONCURRENCY: "8"
  RHYTHM_DEPLOYMENT_JOB_CONCURRENCY: "4"
  RHYTHM_SCHEDULER_BATCH_SIZE: "1000"
  RHYTHM_SCHEDULER_POLL_MS: "500"
  RHYTHM_TARGET_HOST_CONCURRENCY: "16"
  RHYTHM_DATABASE_MAX_CONNS: "16"
  RHYTHM_DATABASE_MIN_CONNS: "2"
  RHYTHM_DATABASE_TRANSACTION_POOLING: "true"
  RHYTHM_SCRIPT_RUNNER_URL: http://rhythm-script-runner:8090
  RHYTHM_BROWSER_RUNNER_URL: http://rhythm-browser-agent:8091
  RHYTHM_ARTIFACT_STORE_URL: http://rhythm-object-store:9000
  RHYTHM_ARTIFACT_STORE_BUCKET: rhythm-browser-artifacts
  RHYTHM_ALLOW_PRIVATE_TARGETS: "false"
  RHYTHM_SCRIPT_RUNNER_CONCURRENCY: "8"
---
apiVersion: v1
kind: Secret
metadata:
  name: rhythm-runtime-secrets
type: Opaque
stringData:
  # Replace these placeholders through External Secrets, Sealed Secrets, or
  # your approved OpenShift secret workflow before deployment.
  RHYTHM_DATABASE_URL: postgres://rhythm:replace-me@pgbouncer.database.svc:5432/rhythm?sslmode=require
  RHYTHM_REDIS_URL: redis://redis.rhythm-data.svc:6379/0
  RHYTHM_SCRIPT_RUNNER_TOKEN: replace-me
  RHYTHM_BROWSER_RUNNER_TOKEN: replace-me
  RHYTHM_SECRETS_ENCRYPTION_KEY: replace-with-32-byte-base64-key
  RHYTHM_ARTIFACT_STORE_ACCESS_KEY: replace-me
  RHYTHM_ARTIFACT_STORE_SECRET_KEY: replace-me
