apiVersion: v1
kind: Service
metadata:
  name: rhythm-api
  labels: { app.kubernetes.io/name: rhythm-api }
spec:
  selector: { app.kubernetes.io/name: rhythm-api }
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: rhythm-web
  labels: { app.kubernetes.io/name: rhythm-web }
spec:
  selector: { app.kubernetes.io/name: rhythm-web }
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: rhythm-script-runner
spec:
  selector: { app.kubernetes.io/name: rhythm-script-runner }
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: rhythm-browser-agent
spec:
  selector: { app.kubernetes.io/name: rhythm-browser-agent }
  ports:
    - name: http
      port: 8091
      targetPort: http
