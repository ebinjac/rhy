# Hydra values for rhythm-control in e3_ipc2.
# Secrets (PostgreSQL, Redis, encryption, SSO groups, and runner tokens)
# are injected by Hydra Vault and must not be committed here.
automaticFailover: true

configMap:
  EPAAS_ENV: e3_ipc2
  ENV: e3
  RHYTHM_SERVICE_ROLE: control
  RHYTHM_ENVIRONMENT: production
  RHYTHM_AUTH_MODE: internal
  RHYTHM_STORAGE_MODE: postgres
  RHYTHM_ARTIFACT_STORE_PROVIDER: s3
  RHYTHM_ARTIFACT_STORE_PREFIX: e3/rhythm
  RHYTHM_ARTIFACT_STORE_AUTO_CREATE: "false"
  RHYTHM_ARTIFACT_STORE_PATH_STYLE: "false"
  RHYTHM_REDIS_TLS: "true"
  RHYTHM_REQUIRED_SCHEMA_VERSION: 000030_hydra_capacity
  RHYTHM_BROWSER_RUNNER_URL: http://rhythm-browser-executor-svc.<HYDRA_PROJECT_NAME>.global:8080
  RHYTHM_DATABASE_MAX_CONNS: "20"
  RHYTHM_EXECUTOR_SLOTS_PER_REPLICA: "256"
  RHYTHM_SCHEDULER_BATCH_SIZE: "5000"
  RHYTHM_SCHEDULER_POLL_MS: "250"
  RHYTHM_DEPLOYMENT_JOB_CONCURRENCY: "4"

deployment:
  lifecycle: {}
  livenessProbe:
    failureThreshold: 3
    httpGet:
      path: /livez
      port: 8080
      scheme: HTTP
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
  readinessProbe:
    failureThreshold: 3
    httpGet:
      path: /health
      port: 8080
      scheme: HTTP
    initialDelaySeconds: 30
    periodSeconds: 15
    successThreshold: 1
    timeoutSeconds: 10
  resourcesLimitsCPU: 2000m
  resourcesLimitsMemory: 4G
  resourcesRequestsCPU: 1000m
  resourcesRequestsMemory: 2G
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

hpa:
  cpuUtilizationPercentage: 75
  enabled: false
  maxReplicas: 1
  minReplicas: 1
