# Console onboarding contract. Replace placeholders before creating the service.
project: <HYDRA_PROJECT_NAME>
service: rhythm-control
description: Rhythm scheduler, durable outbox, notifications, and orchestration.
platform: on-prem
network: intranet
maximumEnvironment: e3
workloadType: regular-application
persistentStorage: none
deploymentMethod: rolling
applicationType: api
routability:
  mode: non-routable
  sso: false
  automaticFailover: true
certificates:
  corporateTrustFromBuildpack: true
  inboundMutualTLS: false
  outboundMutualTLS: false
  messageSigning: false
workflow: .github/workflows/deploy-rhythm-control.yml
valuesPath: deploy/hydra/services/rhythm-control/helm
dockerfile: deploy/hydra/services/rhythm-control/Dockerfile
