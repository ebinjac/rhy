# Console onboarding contract. Set `service` to the one Rhythm service that
# already exists in your Hydra project if its name differs.
project: <HYDRA_PROJECT_NAME>
service: rhythm-standalone # or the existing approved service name
description: Complete Rhythm presentation topology in one routable Hydra service.
platform: on-prem
network: intranet
maximumEnvironment: e3
workloadType: regular-application
persistentStorage: none
deploymentMethod: rolling
applicationType: not-api
routability:
  mode: routable
  sso: false
  applicationUrlPrefix: rhythm
  gdha: active-active-topology-performance
  gtmHealthcheckPath: /health
  generatedUrls:
    e1: https://rhythm-dev.aexp.com
    e2: https://rhythm-qa.aexp.com
    e3: https://rhythm.aexp.com
certificates:
  corporateTrustFromBuildpack: true
  inboundMutualTLS: false
  outboundMutualTLS: false
  messageSigning: false
workflow: .github/workflows/deploy-rhythm-standalone.yml
valuesPath: deploy/hydra/services/rhythm-standalone/helm
dockerfile: deploy/hydra/services/rhythm-standalone/Dockerfile
