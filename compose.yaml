name: rhythm

x-rhythm-build: &rhythm-build
  context: .
  dockerfile: deploy/local/Dockerfile

x-rhythm-environment: &rhythm-environment
  RHYTHM_ENVIRONMENT: development
  RHYTHM_AUTH_MODE: anonymous
  RHYTHM_ALLOWED_ORIGIN: "*"
  RHYTHM_UNRESTRICTED_OUTBOUND: "true"
  RHYTHM_STORAGE_MODE: postgres
  RHYTHM_DATABASE_URL: postgres://rhythm:rhythm-local@postgres:5432/rhythm?sslmode=disable
  # Artifact store comes from the gitignored .env (Compose interpolation). MinIO remains in this file as optional local S3.
  RHYTHM_ARTIFACT_STORE_PROVIDER: ${RHYTHM_ARTIFACT_STORE_PROVIDER:-s3}
  RHYTHM_ARTIFACT_STORE_URL: ${RHYTHM_ARTIFACT_STORE_URL}
  RHYTHM_ARTIFACT_STORE_ACCESS_KEY: ${RHYTHM_ARTIFACT_STORE_ACCESS_KEY}
  RHYTHM_ARTIFACT_STORE_SECRET_KEY: "${RHYTHM_ARTIFACT_STORE_SECRET_KEY}"
  RHYTHM_ARTIFACT_STORE_BUCKET: ${RHYTHM_ARTIFACT_STORE_BUCKET}
  RHYTHM_ARTIFACT_STORE_REGION: ${RHYTHM_ARTIFACT_STORE_REGION:-phx}
  RHYTHM_ARTIFACT_STORE_AUTO_CREATE: ${RHYTHM_ARTIFACT_STORE_AUTO_CREATE:-false}
  RHYTHM_ARTIFACT_STORE_PATH_STYLE: ${RHYTHM_ARTIFACT_STORE_PATH_STYLE:-true}
  RHYTHM_SCRIPT_RUNNER_TOKEN: rhythm-local-script-token
  RHYTHM_BROWSER_RUNNER_URL: http://rhythm-browser-executor:8080
  RHYTHM_BROWSER_RUNNER_TOKEN: rhythm-local-browser-token
  RHYTHM_SECRETS_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  RHYTHM_ELF_BOOTSTRAP_URL: ${RHYTHM_ELF_BOOTSTRAP_URL:-}
  # Optional local Ask Rhythm provider. Encrypted into PostgreSQL on first API start when no AI credential exists.
  RHYTHM_AI_OPENROUTER_API_KEY: ${RHYTHM_AI_OPENROUTER_API_KEY:-}
  RHYTHM_AI_OPENROUTER_MODEL: ${RHYTHM_AI_OPENROUTER_MODEL:-dots-studio/dots-3-note-preview:free}
  # Sahara incident ingest. Empty skips dispatch. Example: https://saharaingest-dev.aexp.com/api/v1/events
  RHYTHM_SAHARA_INGEST_URL: ${RHYTHM_SAHARA_INGEST_URL:-}
  RHYTHM_SAHARA_TIMEOUT_MS: ${RHYTHM_SAHARA_TIMEOUT_MS:-}
  SMTP_HOST: ${SMTP_HOST:-usphx-smtp-qa.axp.com}
  SMTP_PORT: ${SMTP_PORT:-25}
  SMTP_FROM: ${SMTP_FROM:-no-reply@rythm.test.com}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-rythm_support}

services:
  # Local infrastructure. PostgreSQL is required. MinIO is optional if you point the artifact store back at it.
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    environment:
      POSTGRES_DB: rhythm
      POSTGRES_USER: rhythm
      POSTGRES_PASSWORD: rhythm-local
    ports:
      - "${RHYTHM_POSTGRES_PORT:-55432}:5432"
    volumes:
      - rhythm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rhythm -d rhythm"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: rhythm
      MINIO_ROOT_PASSWORD: rhythm-local-artifacts
    ports:
      - "${RHYTHM_MINIO_PORT:-19000}:9000"
      - "${RHYTHM_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - rhythm_minio_data:/data
    restart: unless-stopped

  rhythm-frontdoor:
    image: rhythm-frontdoor:local
    build:
      <<: *rhythm-build
      target: frontdoor
    environment:
      <<: *rhythm-environment
      RHYTHM_SERVICE_ROLE: frontdoor
      RHYTHM_DATABASE_MAX_CONNS: ${RHYTHM_FRONTDOOR_DATABASE_MAX_CONNS:-16}
    ports:
      - "${RHYTHM_WEB_PORT:-3100}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 24
    init: true
    restart: unless-stopped

  rhythm-control:
    image: rhythm-control:local
    build:
      <<: *rhythm-build
      target: control
    environment:
      <<: *rhythm-environment
      RHYTHM_SERVICE_ROLE: control
      RHYTHM_DATABASE_MAX_CONNS: ${RHYTHM_CONTROL_DATABASE_MAX_CONNS:-20}
      RHYTHM_SCHEDULER_BATCH_SIZE: ${RHYTHM_SCHEDULER_BATCH_SIZE:-1000}
      RHYTHM_SCHEDULER_POLL_MS: ${RHYTHM_SCHEDULER_POLL_MS:-500}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 24
    init: true
    restart: unless-stopped

  rhythm-api-executor:
    image: rhythm-api-executor:local
    build:
      <<: *rhythm-build
      target: api-executor
    environment:
      <<: *rhythm-environment
      RHYTHM_SERVICE_ROLE: api-executor
      RHYTHM_WORKER_CONCURRENCY: ${RHYTHM_WORKER_CONCURRENCY:-256}
      RHYTHM_SCRIPT_RUNNER_CONCURRENCY: ${RHYTHM_SCRIPT_RUNNER_CONCURRENCY:-16}
      RHYTHM_DATABASE_MAX_CONNS: ${RHYTHM_EXECUTOR_DATABASE_MAX_CONNS:-12}
      RHYTHM_TARGET_HOST_CONCURRENCY: ${RHYTHM_TARGET_HOST_CONCURRENCY:-16}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 24
    init: true
    restart: unless-stopped

  rhythm-browser-executor:
    image: rhythm-browser-executor:local
    build:
      <<: *rhythm-build
      target: browser-executor
    environment:
      <<: *rhythm-environment
      RHYTHM_SERVICE_ROLE: browser-executor
      RHYTHM_DATABASE_MAX_CONNS: ${RHYTHM_BROWSER_DATABASE_MAX_CONNS:-8}
      RHYTHM_BROWSER_MAX_CONCURRENCY: ${RHYTHM_BROWSER_MAX_CONCURRENCY:-2}
      RHYTHM_CHROMIUM_SANDBOX: "false"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 36
    shm_size: "1gb"
    init: true
    restart: unless-stopped

  # Optional one-container parity profile for presentation and small installs.
  # It does not replace the default four-service topology. Start it explicitly:
  # docker compose --profile standalone up -d rhythm-standalone
  # Packaged UI+API is :3200. Frontend HMR is `npm run dev:web` on :3000 (no image rebuild).
  rhythm-standalone:
    profiles: ["standalone"]
    image: rhythm-standalone:local
    build:
      <<: *rhythm-build
      target: standalone
    environment:
      <<: *rhythm-environment
      RHYTHM_SERVICE_ROLE: standalone
      RHYTHM_QUEUE_BACKEND: postgres
      RHYTHM_DATABASE_MAX_CONNS: ${RHYTHM_STANDALONE_DATABASE_MAX_CONNS:-32}
      RHYTHM_WORKER_CONCURRENCY: ${RHYTHM_STANDALONE_WORKER_CONCURRENCY:-96}
      RHYTHM_SCRIPT_RUNNER_CONCURRENCY: ${RHYTHM_STANDALONE_SCRIPT_CONCURRENCY:-4}
      RHYTHM_BROWSER_JOB_CONCURRENCY: ${RHYTHM_STANDALONE_BROWSER_JOB_CONCURRENCY:-1}
      RHYTHM_BROWSER_MAX_CONCURRENCY: ${RHYTHM_STANDALONE_BROWSER_MAX_CONCURRENCY:-1}
      RHYTHM_DEPLOYMENT_JOB_CONCURRENCY: ${RHYTHM_STANDALONE_DEPLOYMENT_CONCURRENCY:-2}
      RHYTHM_TARGET_HOST_CONCURRENCY: ${RHYTHM_STANDALONE_TARGET_HOST_CONCURRENCY:-12}
      RHYTHM_WORKER_MEMORY_STOP_PERCENT: "75"
      RHYTHM_EXECUTOR_SLOTS_PER_REPLICA: "96"
      RHYTHM_EXECUTOR_MIN_REPLICAS: "1"
      RHYTHM_EXECUTOR_MAX_REPLICAS: "1"
      RHYTHM_CHROMIUM_SANDBOX: "false"
    ports:
      - "${RHYTHM_STANDALONE_WEB_PORT:-3200}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 36
    shm_size: "768mb"
    init: true
    restart: unless-stopped

volumes:
  rhythm_postgres_data:
  rhythm_minio_data:
