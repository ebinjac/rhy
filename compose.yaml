name: rhythm

services:
  postgres:
    image: postgres:17-alpine
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    environment:
      POSTGRES_DB: rhythm
      POSTGRES_USER: rhythm
      POSTGRES_PASSWORD: rhythm-local
    ports:
      - "${RHYTHM_POSTGRES_PORT:-55432}:5432"
    volumes:
      - rhythm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rhythm -d rhythm"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:8.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${RHYTHM_REDIS_PORT:-56379}:6379"
    volumes:
      - rhythm_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: rhythm
      MINIO_ROOT_PASSWORD: rhythm-local-artifacts
    ports:
      - "${RHYTHM_MINIO_PORT:-19000}:9000"
      - "${RHYTHM_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - rhythm_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 18
    restart: unless-stopped

  migrate:
    image: rhythm-api:local
    build:
      context: ./services/api
    entrypoint: ["/usr/local/bin/rhythm-migrate"]
    environment:
      RHYTHM_DATABASE_URL: postgres://rhythm:rhythm-local@postgres:5432/rhythm?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: rhythm-api:local
    build:
      context: ./services/api
    environment: &rhythm-api-environment
      RHYTHM_HTTP_ADDR: :8080
      RHYTHM_ROLE: ${RHYTHM_API_ROLE:-all}
      RHYTHM_WORKER_CONCURRENCY: ${RHYTHM_WORKER_CONCURRENCY:-32}
      RHYTHM_SCHEDULER_BATCH_SIZE: ${RHYTHM_SCHEDULER_BATCH_SIZE:-1000}
      RHYTHM_SCHEDULER_POLL_MS: ${RHYTHM_SCHEDULER_POLL_MS:-500}
      RHYTHM_TARGET_HOST_CONCURRENCY: ${RHYTHM_TARGET_HOST_CONCURRENCY:-16}
      RHYTHM_DATABASE_MAX_CONNS: ${RHYTHM_DATABASE_MAX_CONNS:-20}
      RHYTHM_DATABASE_MIN_CONNS: ${RHYTHM_DATABASE_MIN_CONNS:-2}
      RHYTHM_ALLOWED_ORIGIN: http://localhost:${RHYTHM_WEB_PORT:-3100}
      RHYTHM_DEVELOPMENT_ACTOR_ID: local-admin
      RHYTHM_STORAGE_MODE: postgres
      RHYTHM_DATABASE_URL: postgres://rhythm:rhythm-local@postgres:5432/rhythm?sslmode=disable
      RHYTHM_REDIS_URL: redis://redis:6379/0
      RHYTHM_SCRIPT_RUNNER_URL: http://script-runner:8090
      RHYTHM_SCRIPT_RUNNER_TOKEN: rhythm-local-script-token
      RHYTHM_BROWSER_RUNNER_URL: http://browser-agent:8091
      RHYTHM_BROWSER_RUNNER_TOKEN: rhythm-local-browser-token
      RHYTHM_ARTIFACT_STORE_URL: http://minio:9000
      RHYTHM_ARTIFACT_STORE_ACCESS_KEY: rhythm
      RHYTHM_ARTIFACT_STORE_SECRET_KEY: rhythm-local-artifacts
      RHYTHM_ARTIFACT_STORE_BUCKET: rhythm-browser-artifacts

      RHYTHM_ALLOW_PRIVATE_TARGETS: "true"
      # Optional: point at an external OpenSearch for ELF bootstrap seed. Leave unset when
      # configuring ELF against a production/shared cluster via the UI.
      RHYTHM_ELF_BOOTSTRAP_URL: ${RHYTHM_ELF_BOOTSTRAP_URL:-}
      # 32-byte AES key (base64). Local-only default — replace in any shared environment.
      RHYTHM_SECRETS_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      # External SMTP relay (no auth). Override with SMTP_* / RHYTHM_SMTP_* as needed.
      SMTP_HOST: ${SMTP_HOST:-usazphx-mrlye2-vip.qa.test.com}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_FROM: ${SMTP_FROM:-${SMTP_FROM_EMAIL:-no-reply@rythm.test.com}}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-rythm_support}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TO: ${SMTP_TO:-}
    ports:
      - "${RHYTHM_API_PORT:-18080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      script-runner:
        condition: service_healthy
      browser-agent:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
    init: true
    restart: unless-stopped

  # Opt-in single-host scale profile. Start with:
  # RHYTHM_API_ROLE=api docker compose --profile scale up --scale api-worker=4
  api-worker:
    profiles: ["scale"]
    image: rhythm-api:local
    build:
      context: ./services/api
    environment:
      <<: *rhythm-api-environment
      RHYTHM_ROLE: worker
      RHYTHM_HTTP_ADDR: :8080
      RHYTHM_DATABASE_MAX_CONNS: ${RHYTHM_WORKER_DATABASE_MAX_CONNS:-12}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      script-runner:
        condition: service_healthy
      browser-agent:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
    init: true
    restart: unless-stopped

  scheduler:
    profiles: ["scale"]
    image: rhythm-api:local
    build:
      context: ./services/api
    environment:
      <<: *rhythm-api-environment
      RHYTHM_ROLE: scheduler
      RHYTHM_DATABASE_MAX_CONNS: ${RHYTHM_SCHEDULER_DATABASE_MAX_CONNS:-8}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      script-runner:
        condition: service_healthy
      browser-agent:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
    init: true
    restart: unless-stopped

  background-worker:
    profiles: ["scale"]
    image: rhythm-api:local
    build:
      context: ./services/api
    environment:
      <<: *rhythm-api-environment
      RHYTHM_ROLE: background
      RHYTHM_DATABASE_MAX_CONNS: ${RHYTHM_BACKGROUND_DATABASE_MAX_CONNS:-8}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      script-runner:
        condition: service_healthy
      browser-agent:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
    init: true
    restart: unless-stopped

  browser-agent:
    image: rhythm-browser-agent:local
    build:
      context: ./services/browser-agent
    environment:
      RHYTHM_BROWSER_AGENT_ADDR: 0.0.0.0
      RHYTHM_BROWSER_AGENT_PORT: "8091"
      RHYTHM_BROWSER_RUNNER_TOKEN: rhythm-local-browser-token
      RHYTHM_BROWSER_ALLOW_PRIVATE_TARGETS: "true"
      RHYTHM_BROWSER_MAX_CONCURRENCY: "2"
      # Docker Desktop does not expose the user namespace required by
      # Chromium's inner sandbox. The surrounding container remains locked
      # down (non-root, read-only, cap-drop, no-new-privileges, PID/memory).
      RHYTHM_CHROMIUM_SANDBOX: "false"
    expose:
      - "8091"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8091/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
    read_only: true
    tmpfs:
      - /tmp:size=512m,nosuid
    shm_size: "1gb"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1536m
    init: true
    restart: unless-stopped

  script-runner:
    image: rhythm-api:local
    build:
      context: ./services/api
    entrypoint: ["/usr/local/bin/rhythm-script-runner"]
    environment:
      RHYTHM_SCRIPT_RUNNER_ADDR: :8090
      RHYTHM_SCRIPT_RUNNER_TOKEN: rhythm-local-script-token
      RHYTHM_SCRIPT_RUNNER_CONCURRENCY: ${RHYTHM_SCRIPT_RUNNER_CONCURRENCY:-8}
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    init: true
    restart: unless-stopped

  web:
    image: rhythm-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      RHYTHM_API_URL: http://api:8080
    ports:
      - "${RHYTHM_WEB_PORT:-3100}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 18
    init: true
    restart: unless-stopped

volumes:
  rhythm_postgres_data:
  rhythm_redis_data:
  rhythm_minio_data:
