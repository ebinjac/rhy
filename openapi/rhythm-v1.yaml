openapi: 3.1.0
info:
  title: Rhythm API
  version: 0.0.1-current
  description: Public control-plane contract for Rhythm synthetic monitoring and deployment validation.
servers:
  - url: http://localhost:18080
    description: Local Docker
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Monitors
  - name: Runs
  - name: Applications
  - name: Alerts
  - name: Dynatrace
  - name: ELF
  - name: Validation suites
  - name: Deployment validation
  - name: AI copilot
paths:
  /livez:
    get:
      tags: [Health]
      security: []
      operationId: getLiveness
      summary: Check process liveness without querying dependencies
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /readyz:
    get:
      tags: [Health]
      security: []
      operationId: getReadiness
      summary: Inspect cached, parallel dependency readiness
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "503": { $ref: "#/components/responses/Error" }
  /healthz:
    get:
      tags: [Health]
      security: []
      operationId: getHealth
      summary: Inspect API and dependency health
      responses:
        "200":
          description: Healthy or partially healthy service state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "503":
          description: One or more required dependencies are unavailable
  /health:
    get:
      tags: [Health]
      security: []
      operationId: getHydraHealth
      summary: Check Hydra readiness on the platform-standard endpoint
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/session:
    get:
      tags: [Health]
      operationId: getSession
      summary: Get the authenticated actor and effective Rhythm roles
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Principal" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/ai/settings:
    get:
      tags: [AI copilot]
      operationId: getAISettings
      summary: Get the active provider-neutral AI configuration without its credential
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "503": { $ref: "#/components/responses/Error" }
    put:
      tags: [AI copilot]
      operationId: saveAISettings
      summary: Save Compass360 or OpenRouter provider settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIProviderSettingsInput"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/ai/settings/test:
    post:
      tags: [AI copilot]
      operationId: testAISettings
      summary: Verify provider authentication, a JSON chat completion, and tool-call compatibility
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "422": { $ref: "#/components/responses/Success" }
  /api/v1/ai/capabilities:
    get:
      tags: [AI copilot]
      operationId: getAICapabilities
      summary: Get normalized capabilities of the active provider
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "428": { $ref: "#/components/responses/Error" }
  /api/v1/ai/conversations:
    get:
      tags: [AI copilot]
      operationId: listAIConversations
      summary: List sanitized conversations owned by this browser session
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      tags: [AI copilot]
      operationId: createAIConversation
      summary: Start a browser-owned AI investigation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 120 }
                contextType: { type: string }
                contextId: { type: string }
      responses:
        "201": { $ref: "#/components/responses/Success" }
  /api/v1/ai/conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [AI copilot]
      operationId: getAIConversation
      summary: Get one sanitized conversation and its retained messages
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [AI copilot]
      operationId: deleteAIConversation
      summary: Delete a conversation owned by this browser session
      responses:
        "204": { description: Conversation deleted }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [AI copilot]
      operationId: updateAIConversation
      summary: Update the specialist or resource context for a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contextType: { type: string }
                contextId: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/ai/conversations/{conversationId}/messages:
    post:
      tags: [AI copilot]
      operationId: sendAIMessage
      summary: Send a grounded Ask Rhythm question and receive a JSON chat completion
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 32768 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "428": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/ai/messages/{messageId}/feedback:
    post:
      tags: [AI copilot]
      operationId: saveAIMessageFeedback
      summary: Record helpful or not-helpful feedback for an owned assistant message
      parameters:
        - name: messageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: string, enum: [HELPFUL, NOT_HELPFUL] }
                comment: { type: string, maxLength: 1000 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/ai/deployment-runs/{deploymentRunId}/report:
    parameters:
      - name: deploymentRunId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [AI copilot]
      operationId: getAIDeploymentReport
      summary: Get the persisted AI deployment validation report for a completed run
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      tags: [AI copilot]
      operationId: generateAIDeploymentReport
      summary: Generate a grounded Markdown deployment validation report from server-assembled run facts
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/overview:
    get:
      tags: [Health]
      operationId: getOperationalOverview
      summary: Get bounded operational counts, incidents, recent runs, and readiness
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/monitors:
    get:
      tags: [Monitors]
      operationId: listMonitors
      summary: List monitors
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Error"
    post:
      tags: [Monitors]
      operationId: createMonitor
      summary: Create a monitor draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/monitors/{monitorId}/metrics/summary:
    get:
      tags: [Monitors]
      operationId: getMonitorMetricsSummary
      parameters:
        - $ref: "#/components/parameters/MonitorId"
        - { name: window, in: query, schema: { type: string, default: 24h } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/monitors/{monitorId}/metrics/series:
    get:
      tags: [Monitors]
      operationId: getMonitorMetricsSeries
      parameters:
        - $ref: "#/components/parameters/MonitorId"
        - { name: window, in: query, schema: { type: string, default: 24h } }
        - { name: resolution, in: query, schema: { type: string, default: auto } }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/monitors/{monitorId}/runs:
    post:
      tags: [Runs]
      operationId: runMonitor
      summary: Queue a manual monitor run
      parameters:
        - $ref: "#/components/parameters/MonitorId"
      responses:
        "202":
          description: Run queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/runs/{runId}/diagnostics:
    get:
      tags: [Runs]
      operationId: getRunDiagnostics
      summary: Get masked execution diagnostics
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/runs/{runId}/diagnostics/summary:
    get:
      tags: [Runs]
      operationId: getRunDiagnosticsSummary
      summary: Get the bounded operational run summary
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/runs/{runId}/events:
    get:
      tags: [Runs]
      operationId: listRunEvents
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/runs/{runId}/steps/{stepRunId}:
    get:
      tags: [Runs]
      operationId: getRunStepDiagnostics
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: stepRunId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/alerts:
    get:
      tags: [Alerts]
      operationId: listAlerts
      summary: List lightweight alert summaries with database-backed filters
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - { name: query, in: query, schema: { type: string } }
        - { name: sourceType, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: severity, in: query, schema: { type: string } }
        - { name: applicationId, in: query, schema: { type: string, format: uuid } }
        - { name: serviceId, in: query, schema: { type: string, format: uuid } }
        - { name: monitorType, in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/alerts/summary:
    get:
      tags: [Alerts]
      operationId: getAlertSummary
      summary: Get compact inbox totals without loading alert evidence
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/applications:
    get:
      tags: [Applications]
      operationId: listApplications
      summary: List applications and ownership context
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /api/v1/elf/queries:
    get:
      tags: [ELF]
      operationId: listElfQueries
      summary: List saved ELF queries
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /api/v1/suites/{suiteId}/runs:
    post:
      tags: [Validation suites]
      operationId: createValidationSuiteRun
      summary: Queue a validation-suite execution
      parameters:
        - name: suiteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                triggerType: { type: string, default: MANUAL }
                deployment:
                  type: object
                  properties:
                    deploymentId: { type: string }
                    version: { type: string }
                    commit: { type: string }
                    deploymentStart: { type: string, format: date-time }
      responses:
        "202":
          description: Validation suite run queued
          headers:
            Location:
              schema: { type: string }
              description: Pollable suite-run resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/suite-runs/{suiteRunId}:
    get:
      tags: [Validation suites]
      operationId: getValidationSuiteRun
      summary: Get queued or completed validation-suite evidence
      parameters:
        - name: suiteRunId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/suite-runs/{suiteRunId}/cancel:
    post:
      tags: [Validation suites]
      operationId: cancelValidationSuiteRun
      summary: Request persistent cancellation of a queued or active suite run
      parameters:
        - name: suiteRunId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/suites/{suiteId}/deployment-runs:
    post:
      tags: [Deployment validation]
      operationId: createDeploymentRun
      summary: Queue before/after deployment validation
      parameters:
        - name: suiteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deployment]
              properties:
                baselineWindow: { type: string, enum: [24h, 7d, 30d] }
                sampleCount: { type: integer, minimum: 3, maximum: 50 }
                sampleIntervalSeconds: { type: integer, minimum: 1, maximum: 300 }
                deployment:
                  type: object
                  required: [deploymentStart]
                  properties:
                    deploymentStart: { type: string, format: date-time }
                    deploymentCompletedAt:
                      type: string
                      format: date-time
                      description: Required when the suite contains a Dynatrace infrastructure check.
      responses:
        "202":
          description: Deployment validation queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/applications/{applicationId}/environments:
    get:
      tags: [Dynatrace]
      operationId: listApplicationEnvironments
      summary: List Environment profile bindings for an application
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      tags: [Dynatrace]
      operationId: createApplicationEnvironment
      summary: Bind an Environment profile to an application
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [environmentProfileId]
              properties:
                environmentProfileId: { type: string, format: uuid }
                enabled: { type: boolean, default: true }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/applications/{applicationId}/environments/{environmentBindingId}:
    patch:
      tags: [Dynatrace]
      operationId: updateApplicationEnvironment
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/EnvironmentBindingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [environmentProfileId]
              properties:
                environmentProfileId: { type: string, format: uuid }
                enabled: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Success" }
    delete:
      tags: [Dynatrace]
      operationId: deleteApplicationEnvironment
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/EnvironmentBindingId"
      responses:
        "204": { description: Environment binding deleted }
  /api/v1/applications/{applicationId}/dynatrace/context:
    post:
      tags: [Dynatrace]
      operationId: ensureApplicationDynatraceContext
      summary: Prepare the internal Dynatrace context from application metadata
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/applications/{applicationId}/environments/{environmentBindingId}/dynatrace:
    get:
      tags: [Dynatrace]
      operationId: getApplicationDynatrace
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/EnvironmentBindingId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [Dynatrace]
      operationId: saveApplicationDynatrace
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/EnvironmentBindingId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DynatraceConfigurationInput" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/applications/{applicationId}/environments/{environmentBindingId}/dynatrace/test:
    post:
      tags: [Dynatrace]
      operationId: testApplicationDynatrace
      summary: Verify entities.read and metrics.read using the effective credential
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/EnvironmentBindingId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/applications/{applicationId}/environments/{environmentBindingId}/dynatrace/management-zones:
    get:
      tags: [Dynatrace]
      operationId: listDynatraceManagementZones
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/EnvironmentBindingId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/applications/{applicationId}/environments/{environmentBindingId}/dynatrace/resources:
    get:
      tags: [Dynatrace]
      operationId: getDynatraceResourcePreview
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/EnvironmentBindingId"
        - name: serviceId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/applications/{applicationId}/environments/{environmentBindingId}/dynatrace/resources/preview:
    post:
      tags: [Dynatrace]
      operationId: previewDynatraceResources
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/EnvironmentBindingId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                serviceId: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/applications/{applicationId}/environments/{environmentBindingId}/dynatrace/resources/discover:
    post:
      tags: [Dynatrace]
      operationId: discoverDynatraceResources
      summary: Discover selectable Hydra workloads or TIMS servers
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/EnvironmentBindingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform]
              properties:
                platform: { type: string, enum: [HYDRA, TIMS] }
                managementZones:
                  type: array
                  items: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "502": { $ref: "#/components/responses/Error" }
  /api/v1/applications/{applicationId}/environments/{environmentBindingId}/dynatrace/rules:
    get:
      tags: [Dynatrace]
      operationId: listDynatraceRules
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/EnvironmentBindingId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
    put:
      tags: [Dynatrace]
      operationId: saveDynatraceRules
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/EnvironmentBindingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/DynatraceRule" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/applications/{applicationId}/environments/{environmentBindingId}/dynatrace/query:
    post:
      tags: [Dynatrace]
      operationId: queryApplicationDynatrace
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/EnvironmentBindingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timeFrom, timeTo]
              properties:
                serviceId: { type: string, format: uuid }
                platform: { type: string, enum: [HYDRA, TIMS] }
                timeFrom: { type: string, format: date-time }
                timeTo: { type: string, format: date-time }
                resolution: { type: string, example: 1m }
                deploymentRunId: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/applications/{applicationId}/services/{serviceId}/environments/{environmentBindingId}/dynatrace:
    get:
      tags: [Dynatrace]
      operationId: getServiceDynatrace
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/ServiceId"
        - $ref: "#/components/parameters/EnvironmentBindingId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
    put:
      tags: [Dynatrace]
      operationId: saveServiceDynatrace
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/ServiceId"
        - $ref: "#/components/parameters/EnvironmentBindingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/applications/{applicationId}/opensearch-alerts/service-assignment:
    post:
      tags: [Alerts]
      operationId: assignOpenSearchAlertsToService
      summary: Tag selected OpenSearch receiver alerts to an application service
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenSearchAlertServiceAssignmentInput"
      responses:
        "200":
          description: Alerts were assigned atomically
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OpenSearchAlertServiceAssignmentResult"
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/dynatrace/runs:
    get:
      tags: [Dynatrace]
      operationId: listDynatraceRuns
      parameters:
        - { name: applicationId, in: query, schema: { type: string, format: uuid } }
        - { name: environmentBindingId, in: query, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/dynatrace/runs/{runId}:
    get:
      tags: [Dynatrace]
      operationId: getDynatraceRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/dynatrace/runs/{runId}/cancel:
    post:
      tags: [Dynatrace]
      operationId: cancelDynatraceRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "202": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque cursor returned by the previous page.
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    MonitorId:
      name: monitorId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EnvironmentBindingId:
      name: environmentBindingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Success:
      description: Successful response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessEnvelope"
    Error:
      description: Safe error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    SuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ResponseMeta:
      type: object
      required: [requestId]
      properties:
        requestId: { type: string }
        page:
          type: object
          properties:
            nextCursor: { type: [string, "null"] }
            limit: { type: integer }
    Principal:
      type: object
      required: [id, roles]
      properties:
        id: { type: string, minLength: 1, maxLength: 255 }
        roles:
          type: array
          uniqueItems: true
          items: { type: string, enum: [ADMINISTRATOR, EDITOR, OPERATOR, VIEWER] }
    AIProviderSettingsInput:
      type: object
      additionalProperties: false
      required:
        - name
        - providerType
        - environment
        - baseUrl
        - completionPath
        - defaultModel
        - timeoutSeconds
        - maxConcurrency
        - maxToolRounds
        - maxInputTokens
        - maxOutputTokens
        - dailyRequestLimit
        - active
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        providerType: { type: string, enum: [COMPASS360, OPENROUTER, OPENROUTER_DEMO] }
        environment: { type: string }
        baseUrl: { type: string, format: uri }
        completionPath: { type: string, default: /v1/completions, description: OpenAI-compatible path. OpenRouter uses /chat/completions against https://openrouter.ai/api/v1. }
        defaultModel: { type: string, minLength: 1 }
        approvedModels:
          type: array
          uniqueItems: true
          description: Model-router fallbacks. OpenRouter sends these as the `models` array after the default model.
          items: { type: string }
        requiredCapabilities:
          type: object
          additionalProperties: { type: boolean }
        proxyUrl: { type: string }
        timeoutSeconds: { type: integer, minimum: 5, maximum: 120 }
        maxConcurrency: { type: integer, minimum: 1, maximum: 32 }
        maxToolRounds: { type: integer, minimum: 1, maximum: 8 }
        maxInputTokens: { type: integer, minimum: 256, maximum: 131072 }
        maxOutputTokens: { type: integer, minimum: 128, maximum: 32768 }
        dailyRequestLimit: { type: integer, minimum: 1, maximum: 1000000 }
        active: { type: boolean }
        apiKey:
          type: string
          writeOnly: true
          description: Write-only bearer credential encrypted with AES-256-GCM in PostgreSQL.
    OpenSearchAlertServiceAssignmentInput:
      type: object
      additionalProperties: false
      required: [alertIds, serviceId]
      properties:
        alertIds:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items: { type: string, format: uuid }
        serviceId:
          description: Application service UUID, or an empty string to clear the assignment.
          anyOf:
            - type: string
              format: uuid
            - const: ""
    OpenSearchAlertServiceAssignmentResult:
      type: object
      required: [assignedCount]
      properties:
        assignedCount: { type: integer, minimum: 0, maximum: 200 }
        serviceId: { type: string, format: uuid }
        serviceName: { type: string }
    DynatraceConfigurationInput:
      type: object
      required: [connectionProfileId, platforms, managementZones, metricMappings, resourceMappings, rules]
      properties:
        connectionProfileId: { type: string, format: uuid }
        credentialSecretRef:
          type: string
          description: An encrypted Rhythm secret alias; resolved values are never accepted or returned.
        platforms:
          type: array
          minItems: 1
          items: { type: string, enum: [HYDRA, TIMS] }
        managementZones:
          type: array
          items: { type: string }
        metricMappings:
          type: object
          description: Platform-specific base metrics. Rhythm compiles AVG and MAX selectors with the governed Hydra or TIMS split dimension.
          properties:
            cpu: { type: string }
            memory: { type: string }
            hydraCpu:
              type: string
              default: builtin:containers.cpu.usagePercent
            hydraMemory:
              type: string
              default: builtin:containers.memory.usagePercent
            timsCpu:
              type: string
              default: builtin:host.cpu.usage
            timsMemory:
              type: string
              default: builtin:host.mem.usage
        baselineWindowSeconds: { type: integer, minimum: 300, maximum: 2592000 }
        stabilizationSeconds: { type: integer, minimum: 0, maximum: 86400 }
        postWindowSeconds: { type: integer, minimum: 60, maximum: 86400 }
        enabled: { type: boolean }
        resourceMappings:
          type: array
          items: { $ref: "#/components/schemas/DynatraceResourceMapping" }
        rules:
          type: array
          items: { $ref: "#/components/schemas/DynatraceRule" }
    DynatraceResourceMapping:
      type: object
      required: [platform, entityType, mappingType, value]
      properties:
        serviceId: { type: string, format: uuid }
        platform: { type: string, enum: [HYDRA, TIMS] }
        entityType: { type: string }
        mappingType:
          type: string
          enum: [ENTITY_ID, TAG, HOST_GROUP, NAMESPACE, WORKLOAD, CONTAINER_GROUP, CLUSTER, HOST]
        value: { type: string, maxLength: 500 }
        label: { type: string }
        enabled: { type: boolean, default: true }
    DynatraceRule:
      type: object
      required: [name, metric, statistic, operator, threshold, comparison, scope, gateMode]
      properties:
        serviceId: { type: string, format: uuid }
        name: { type: string }
        metric: { type: string, enum: [CPU, MEMORY] }
        statistic: { type: string, enum: [AVERAGE, MAXIMUM, LATEST, P50, P95] }
        operator: { type: string, enum: [GT, GTE, LT, LTE, EQ] }
        threshold: { type: number }
        comparison: { type: string, enum: [ABSOLUTE, BASELINE_ABSOLUTE, BASELINE_PERCENT] }
        scope: { type: string, enum: [APPLICATION, SERVICE, RESOURCE] }
        gateMode: { type: string, enum: [ADVISORY, BLOCKING] }
        minimumCoveragePercent: { type: number, minimum: 0, maximum: 100 }
        consecutivePoints: { type: integer, minimum: 1 }
        enabled: { type: boolean }
